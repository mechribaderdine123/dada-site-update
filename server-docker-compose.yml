# Dada Hip Hop Academy — production stack.
#
#   db     PostgreSQL database (accounts, profiles, tracks, clips, content)
#   app    Node server: SSR pages + /api + /media (upload folder on a volume)
#
# On this host Caddy terminates TLS and reverse-proxies to 127.0.0.1:3000,
# so the nginx/certbot services are intentionally omitted here.
#
# Start everything with:  docker compose up -d --build
#
# Every service below is attached explicitly to the same `dada` network.
# Do not rely on Compose's implicit default network here: if the db and the
# app end up on different networks the host name `db` stops resolving and the
# app fails its migrations with "getaddrinfo EAI_AGAIN db", which shows up as
# a permanently unhealthy container and a 502 from the reverse proxy.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: dada-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dadahiphop}
      POSTGRES_USER: ${POSTGRES_USER:-dadahiphop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}

    ports:
      # Bound to loopback only. The app reaches the database over the compose
      # network (db:5432), so this exists purely for host-side tooling
      # (psql, migrations). Never publish 5432 on 0.0.0.0: Docker's published
      # ports bypass ufw/firewalld, so 0.0.0.0 here exposes Postgres to the
      # whole internet no matter what the host firewall says.
      - "127.0.0.1:5432:5432"

    networks:
      - dada

    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dadahiphop} -d ${POSTGRES_DB:-dadahiphop}"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
    restart: unless-stopped
    container_name: dada-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      # Built from the POSTGRES_* values so it always points at the db service.
      # Do not use DATABASE_URL from .env here: a host-side "localhost" resolves
      # to the app container itself and the pool can never reach the database.
      DATABASE_URL: postgres://${POSTGRES_USER:-dadahiphop}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-dadahiphop}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in .env}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
      MAX_AUDIO_BYTES: ${MAX_AUDIO_BYTES:-78643200}
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-8388608}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Outgoing mail (mailbox confirmation + password reset). SMTP_HOST set =
      # mail enabled; the guard in accounts.server.ts refuses sign-ups when unset.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SITE_URL: ${SITE_URL:-}
    volumes:
      - uploads:${UPLOAD_DIR:-/data/uploads}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/auth/session || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    # Loopback only: the reverse proxy in front of the app is what the internet
    # talks to, never the Node server directly.
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - dada

volumes:
  db_data:
  uploads:

networks:
  dada:
    driver: bridge
